; Canvas SIP intercom — PJSIP endpoints.
;
; Each edge device registers as an endpoint. Replace CHANGE_ME with a real
; password (or generate one per device) before exposing this beyond the LAN.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── Endpoints ───────────────────────────────────────────────────────────────
[1001]
type=endpoint
context=intercom
disallow=all
allow=ulaw
allow=opus
direct_media=no
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=CHANGE_ME

[1001]
type=aor
max_contacts=2

[1002]
type=endpoint
context=intercom
disallow=all
allow=ulaw
allow=opus
direct_media=no
auth=1002
aors=1002

[1002]
type=auth
auth_type=userpass
username=1002
password=CHANGE_ME

[1002]
type=aor
max_contacts=2

[1003]
type=endpoint
context=intercom
disallow=all
allow=ulaw
allow=opus
direct_media=no
auth=1003
aors=1003

[1003]
type=auth
auth_type=userpass
username=1003
password=CHANGE_ME

[1003]
type=aor
max_contacts=2
