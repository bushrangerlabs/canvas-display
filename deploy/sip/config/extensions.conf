; Canvas SIP intercom — dialplan.
;
; 1001/1002/1003  call a single device
; 8000            page ALL registered devices (Echo-style broadcast)

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[intercom]
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,30)
 same => n,Hangup()

exten => 1003,1,Dial(PJSIP/1003,30)
 same => n,Hangup()

; Page every registered endpoint at once (one-way audio broadcast).
exten => 8000,1,Page(PJSIP/1001&PJSIP/1002&PJSIP/1003)
 same => n,Hangup()
