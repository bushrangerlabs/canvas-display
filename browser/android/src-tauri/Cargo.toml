[package]
name = "canvas-display-browser-android"
version = "0.1.0"
description = "Canvas Display kiosk client for Android"
authors = ["Canvas Display"]
edition = "2021"

[lib]
name = "canvas_display_browser_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-multiwebview = { path = "../tauri-plugin-multiwebview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
