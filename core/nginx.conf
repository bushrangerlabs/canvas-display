events {}

http {
  server {
    listen 443 ssl;
    server_name 192.168.1.108 localhost;

    # Offer RSA first for Chromium/Firefox builds that reject Ed25519 X.509 certificates,
    # while retaining the Ed25519 identity for compatible Edge clients.
    ssl_certificate /etc/nginx/tls/rsa-server.crt;
    ssl_certificate_key /etc/nginx/tls/rsa-server.key;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location /releases/ {
      alias /srv/releases/;
      autoindex off;
      add_header Cache-Control "no-store";
    }

    location / {
      proxy_pass http://canvas-core:3100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 90s;
    }
  }
}
