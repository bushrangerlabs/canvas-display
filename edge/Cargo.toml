[workspace]
members = ["agent", "agentd", "dev-gateway-harness", "updater", "updaterd", "release-signer"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
regress = "0.10.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
uuid = { version = "1.16.0", features = ["serde"] }
jsonschema = { version = "0.48.0", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tempfile = "3.14.0"
ctrlc = "3.4.5"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
libc = "0.2.169"
tokio = { version = "1.41.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.24.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["custom-provider"] }
flume = "0.11.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
